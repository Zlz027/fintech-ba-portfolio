name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: 财务函数库回归测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装运行与测试依赖
        run: |
          python -m pip install --upgrade pip
          # 各项目依赖取并集（pandas/numpy/scikit-learn 等，供 finance.py 运行）
          pip install pandas numpy scikit-learn matplotlib seaborn xgboost shap
          pip install pytest

      - name: 语法检查（全部源码与脚本）
        run: |
          python -m compileall -q src tests 01-credit-scorecard 02-customer-churn \
            03-fraud-detection 04-monthly-business-pack

      - name: 运行回归测试
        run: pytest -q

  markdown-links:
    name: README 图片链接有效性检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验 README 内引用的图片均存在
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path

          root = Path(".")
          errors = []
          for readme in sorted(root.glob("*/README.md")) + [root / "README.md"]:
              if not readme.exists():
                  continue
              text = readme.read_text(encoding="utf-8")
              for alt, path in re.findall(r"!\[([^\]]*)\]\(([^)]+)\)", text):
                  target = (readme.parent / path).resolve()
                  if not target.exists():
                      errors.append(f"{readme}: 缺失 {path}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("✅ 全部 README 图片引用有效")
          PY
